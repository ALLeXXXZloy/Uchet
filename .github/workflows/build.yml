name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Find Project and Build
        run: |
          # Робот ищет файл settings.gradle.kts по всем папкам
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Ошибка: Файл settings.gradle.kts вообще не найден в репозитории!"
            exit 1
          fi
          
          echo "Найден проект в папке: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Uchet-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
